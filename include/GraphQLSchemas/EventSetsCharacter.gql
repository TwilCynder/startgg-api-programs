query EventStandingsQuery($slug: String!, $page: Int, $perPage: Int) {
    event(slug: $slug) {
        sets  (page: $page, perPage: $perPage)  {
            nodes {
                games {
                    winnerId
                    selections {
                        selectionValue
                    }
                    stage {
                        id
                    }
                }
                slots {
                    entrant {
                        id
                        name
                        participants {
                            player {
                                id
                                gamerTag
                            }
                            user {
                                discriminator
                            }
                        }
                        initialSeedNum
                    }
                    standing {
                        stats {
                            score {
                                value
                            }
                        }
                    }
                }
            }
        }
    }
}